server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The service worker must never be served stale from the browser HTTP
    # cache, otherwise update checks will miss new deploys.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
