server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate the HTML shell so a new deploy is picked up. All
    # JavaScript and CSS filenames are content-hashed, so the fresh HTML can
    # only reference assets from that same build.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
