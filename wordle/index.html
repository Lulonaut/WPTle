	<meta property="og:title" content="WPTle">

	<script>
		// WPTle no longer uses a service worker. Unregister any worker left
		// behind by an older version and delete its caches so they can never
		// serve stale assets. Runs on every origin, including development.
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.getRegistrations()
				.then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
				.catch(() => { });
		}
		if ("caches" in window) {
			caches.keys()
				.then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
				.catch(() => { });
		}
	</script>

	<script type="module" src="/src/main.ts"></script>
	<!-- changed to something more suited to being the title of a tab in App.svelte. This title is for SEO -->
	<title>WPTle</title>
